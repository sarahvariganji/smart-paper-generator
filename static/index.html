<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paperwright — Maths question paper generator</title>
<style>
:root{--bg:#f6f4ef;--sf:#fff;--tx:#1d2433;--mu:#667085;--ln:#d9d5cb;--ac:#1f4e8c;--wn:#b4540a;--wb:#fdf0e1;--ok:#2d7a4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--sf:#1c2029;--tx:#e8eaf0;--mu:#98a2b3;--ln:#323847;--ac:#7fa8e6;--wn:#f0a35e;--wb:#33261a;--ok:#6cc596}}
:root[data-theme="dark"]{--bg:#14171d;--sf:#1c2029;--tx:#e8eaf0;--mu:#98a2b3;--ln:#323847;--ac:#7fa8e6;--wn:#f0a35e;--wb:#33261a;--ok:#6cc596}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3,.paper{font-family:"Source Serif 4",Georgia,serif}
.app{display:grid;grid-template-columns:330px 1fr;gap:20px;max-width:1180px;margin:0 auto;padding:20px}
@media(max-width:860px){.app{grid-template-columns:1fr}}
.ctl,.paperwrap,.bd{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:16px}
.ctl h1{font-size:22px;margin:0 0 2px}.ctl p{color:var(--mu);margin:0 0 12px;font-size:13px}
fieldset{border:0;border-top:1px solid var(--ln);margin:12px 0 0;padding:10px 0 0}legend{font-weight:600;padding-right:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 0}
input[type=number]{width:70px;padding:5px;border:1px solid var(--ln);border-radius:4px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;cursor:pointer;border-radius:4px;border:1px solid var(--ac);background:var(--ac);color:#fff;padding:7px 12px}
button.g{background:transparent;color:var(--ac)}button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sum{font-size:12px;color:var(--mu)}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.note{background:var(--wb);border-left:4px solid var(--wn);padding:8px 12px;margin:6px 0;font-size:14px;border-radius:0 4px 4px 0}
.note.i{background:var(--bg);border-color:var(--ac)}
.paper{padding:8px 10px}.ph{text-align:center;border-bottom:2px solid var(--tx);padding-bottom:8px;margin-bottom:10px}
.ph h2{margin:0;font-size:22px}.meta{display:flex;justify-content:space-between;font-size:14px;margin-top:6px}
.sec{margin-top:16px}.sec h3{font-size:16px;margin:0 0 6px;border-bottom:1px solid var(--ln);padding-bottom:3px}
.q{display:grid;grid-template-columns:30px 1fr auto;gap:6px;padding:7px 0;border-bottom:1px dotted var(--ln)}
.q .n{font-weight:600}.mk{font-size:13px;white-space:nowrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;margin-top:4px;font-size:14px}
.tag{font:12px "Source Sans 3",system-ui,sans-serif;color:var(--mu);margin-top:3px}
.ans{color:var(--ok);font:13px "Source Sans 3",system-ui,sans-serif;margin-top:3px}
.sw{font-size:12px;padding:3px 8px;margin-left:8px}
.bgrp{margin:8px 0}.bgrp h3{font-size:15px;margin:0 0 4px}
.br{display:grid;grid-template-columns:110px 1fr 130px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.bar{position:relative;height:12px;background:var(--bg);border:1px solid var(--ln);border-radius:2px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ac);opacity:.75}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tx)}
.off{color:var(--wn);font-weight:600}
.lg{font-size:12px;color:var(--mu)}
@media print{body{background:#fff;color:#000}.ctl,.bd,.sw,.noprint,.tag,.ans{display:none!important}.app{display:block;padding:0}.paperwrap{border:0;padding:0}}
</style></head><body>
<div class="app">
<aside class="ctl">
<h1>Paperwright</h1><p>Mathematics paper generator. Set the blueprint; it builds the closest valid paper and tells you what it had to bend.</p>
<div class="row"><label for="tm">Total marks</label><input id="tm" type="number" min="5" max="100" value="40"></div>
<fieldset><legend>Difficulty mix (%)</legend><div id="gd"></div><div class="sum" id="sd"></div></fieldset>
<fieldset><legend>Topic weightage (%)</legend><div id="gt"></div><div class="sum" id="st"></div></fieldset>
<fieldset><legend>Question types (% of marks)</legend><div id="gy"></div><div class="sum" id="sy"></div></fieldset>
<div class="btns"><button id="go">Generate paper</button><button class="g" id="inf">Try an impossible blueprint</button><button class="g" id="rs">Reset</button></div>
<p style="margin-top:12px">MCQ = 1 mark, Short = 3, Long = 5. Generated by the Python engine.</p>
</aside>
<div class="main">
<div id="notes"></div>
<section class="paperwrap"><div class="noprint row"><strong>Question paper</strong><span><label><input type="checkbox" id="sa"> Show answers</label> <button class="g sw" id="pr">Print / PDF</button><button class="g sw" id="ex">Export Word</button></span></div><div class="paper" id="paper"></div></section>
<section class="bd" id="bd"></section>
</div></div>
<script>
const TN={A:"Algebra",G:"Geometry",T:"Trigonometry"},YN={M:"MCQ",S:"Short answer",L:"Long answer"},DN={E:"Easy",M:"Medium",H:"Hard"};
const GR={d:"EMH",t:"AGT",y:"MSL"},NM={d:DN,t:TN,y:YN},DEF={d:[30,50,20],t:[40,30,30],y:[40,40,20]};
const $=id=>document.getElementById(id);
for(const g in GR)$("g"+g).innerHTML=[...GR[g]].map((k,i)=>`<div class="row"><label for="${g}${k}">${NM[g][k]}</label><input type="number" min="0" max="100" id="${g}${k}" value="${DEF[g][i]}"></div>`).join("");
let cur=null;
const req=()=>{const r={total:+$("tm").value||40};for(const g in GR){r[g]={};[...GR[g]].forEach(k=>r[g][k]=+$(g+k).value||0)}return r};
async function api(path,body){const res=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
 if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error||res.statusText)}return res}
const fail=e=>{$("notes").innerHTML=`<div class="note">${e.message}. Is the Python server running?</div>`};
async function generate(){try{cur=await(await api("/api/generate",{req:req()})).json();render()}catch(e){fail(e)}}
async function swap(i){try{cur=await(await api("/api/swap",{req:cur.req,ids:cur.paper.map(q=>q.id),index:i})).json();render()}catch(e){fail(e)}}
async function exportDoc(){if(!cur)return;try{const b=await(await api("/api/export",{ids:cur.paper.map(q=>q.id),answers:$("sa").checked})).blob();
 const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="question_paper.docx";a.click()}catch(e){fail(e)}}
function render(){
 $("notes").innerHTML=cur.notes.map(([k,m])=>`<div class="note ${k==='i'?'i':''}">${m}</div>`).join("");
 $("bd").innerHTML=`<h2 style="margin:0 0 4px;font-size:18px">Breakdown — ${cur.total} marks, ${cur.paper.length} questions</h2><div class="lg">Bar = what the paper has; black tick = what you asked for.</div>`+
 cur.breakdown.map(g=>`<div class="bgrp"><h3>${g.label}</h3>`+g.rows.map(r=>`<div class="br"><span>${r.name}</span><div class="bar"><i style="width:${r.actual}%"></i><b style="left:${r.target}%"></b></div><span class="${r.off?'off':''}">${r.actual}% <span class="lg">(asked ${r.target}%)</span></span></div>`).join("")+`</div>`).join("");
 const sa=$("sa").checked;let n=0;
 const secs=[["M","Section A — Multiple choice (1 mark each)"],["S","Section B — Short answer (3 marks each)"],["L","Section C — Long answer (5 marks each)"]];
 $("paper").innerHTML=`<div class="ph"><h2>Mathematics — Question Paper</h2><div class="meta"><span>Time: ${Math.ceil(cur.total*1.5)} minutes</span><span>Maximum marks: ${cur.total}</span></div></div><div style="font-size:13px">Attempt all questions. Show your working for Sections B and C.</div>`+
 secs.map(([y,h])=>{const qs=cur.paper.map((q,i)=>[q,i]).filter(([q])=>q.y===y);if(!qs.length)return"";
  return `<div class="sec"><h3>${h}</h3>`+qs.map(([q,i])=>{n++;return `<div class="q"><span class="n">${n}.</span><div>${q.q}${q.o?`<div class="opts">${q.o.map((o,j)=>`<span>(${"abcd"[j]}) ${o}</span>`).join("")}</div>`:""}<div class="tag">${TN[q.t]} · ${DN[q.d]}</div>${sa?`<div class="ans">Answer: ${q.o?"("+"abcd"[q.a]+") "+q.o[q.a]:q.a}</div>`:""}</div><span class="mk">[${q.marks}]<button class="g sw" data-i="${i}" aria-label="Swap question ${n}">Swap</button></span></div>`}).join("")+`</div>`}).join("")}
$("paper").onclick=e=>{const i=e.target.dataset.i;if(i!==undefined)swap(+i)};
$("go").onclick=generate;$("sa").onchange=()=>cur&&render();$("pr").onclick=()=>window.print();$("ex").onclick=exportDoc;
$("inf").onclick=()=>{$("tm").value=30;[10,20,70].forEach((v,i)=>$("d"+GR.d[i]).value=v);[80,10,10].forEach((v,i)=>$("t"+GR.t[i]).value=v);[10,10,80].forEach((v,i)=>$("y"+GR.y[i]).value=v);sums();generate()};
$("rs").onclick=()=>{$("tm").value=40;for(const g in GR)[...GR[g]].forEach((k,i)=>$(g+k).value=DEF[g][i]);sums();generate()};
function sums(){for(const g in GR){const s=[...GR[g]].reduce((a,k)=>a+(+$(g+k).value||0),0);$("s"+g).textContent=`Total: ${s}%`+(s===100?"":" (will be scaled to 100%)")}}
document.querySelector(".ctl").addEventListener("input",sums);sums();generate();
</script></body></html>
